<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Chisom Miracle Omeja">
    <meta name="description" content="HTML and CSS Quiz Form">
    <title>HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML & CSS Quiz</h1>
    </header>
    <main>
        <form action="#" method="post">
            <div class="form-row">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="form-row">
                <label for="q2">2. Why is it important to use semantic HTML?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>
            <div class="form-row">
                <label for="q3">3. Which HTML element is used to create a hyperlink</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="a">&lt;a&gt;</option>
                    <option value="link">&lt;link&gt;</option>
                    <option value="href">&lt;href&gt;</option>
                </select>
            </div>
            <div class="form-row">
                <label for="q4">4. How many heading levels does HTML provide?</label>
                <input type="number" id="q4" name="q4">
            </div>
            <div class="submit-row">
                <button type="submit">Submit Quiz</button>
            </div>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 Chisom Miracle Omeja | WDD 130</p>
    </footer>

</body>

</html>
