<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | White Water Rafting</title>
  <meta name="description"
    content="Get in touch with White Water Rafting Company. Find address, phone number and email, meet with our team, or send us a message using our contact form.">
  <meta name="author" content="Miracle Chisom Omeja">
  <link rel="stylesheet" href="styles/rafting.css">


</head>

<body>
  <header>
    <img src="images/rafting-site-logo.png" alt="Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="contact-intro">
      <h1>White Water Rafting Company</h1>
      <address>
        123 Main River Street<br>
        Kolob, California<br>
        <a href="tel:+19999999999">+1 999 999 9999</a><br>
        <a href="mailto:info@whitewater.com">info@whitewater.com</a>
      </address>
    </section>

    <section class="contact-main">
      <h2>Find Us &amp; Send a Message</h2>

      <div class="contact-flex">
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46325.502856529034!2d-110.77555504999998!3d43.474292399999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53531a58fccf7f4b%3A0x3d1c01cbb13a835c!2sJackson%2C%20WY%2C%20USA!5e0!3m2!1sen!2sng!4v1785538527793!5m2!1sen!2sng"
            width="600" height="450" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
          </iframe>
        </div>

        <div class="contact-form">
          <form action="#" method="post">

          <div class="field-name">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Placeholder" required>
          </div>

          <div class="field-email">
            <label for="email-address">Email:</label>
            <input type="email" id="email-address" name="email-address" placeholder="Placeholder"
              required>
          </div>

          <fieldset class="field-purpose">
            <legend class="field-purpose-label">Message Purpose:</legend>

            <div class="purpose-options">
              <div class="purpose-option">
                <input type="radio" id="general" name="purpose" value="general">
                <label for="general">General Inquiry</label>
              </div>

              <div class="purpose-option">
                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label>
              </div>

              <div class="purpose-option">
                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label>
              </div>
            </div>
          </fieldset>

          <div class="field-message">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Type here"
              required></textarea>
          </div>

          <div class="field-subscribe">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
          </div>

          <div class="field-submit">
            <button type="submit">Send Message</button>
          </div>

        </form>
        </div>
      </div>

    </section>

    <section class="employees">
      <h2>We Are Here to Serve You</h2>

      <div class="employee-grid">
        <figure>
          <img src="images/employee1.webp" alt="Photo of Jordan Reyes">
          <figcaption>Jordan Reyes<br>Lead Guide</figcaption>
        </figure>

        <figure>
          <img src="images/employee2.webp" alt="Photo of Casey Nolan">
          <figcaption>Casey Nolan<br>Reservations Manager</figcaption>
        </figure>

        <figure>
          <img src="images/employee3.jpg" alt="Photo of Priya Anand">
          <figcaption>Priya Anand<br>Owner &amp; Founder</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2026 White Water Rafting | Miracle Chisom Omeja</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.svg" alt="Linkedin">
      </a>
    </nav>

  </footer>

</body>

</html>
