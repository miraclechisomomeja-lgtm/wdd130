<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | White Water Rafting</title>
    <meta name="description" content="Learn about our white water rafting adventures and company.">
    <meta name="author" content="Miracle Chisom Omeja">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-site-logo.png" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <section class="contact-main">

            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d..." width="600"
                  height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="White Water Rafting Company location map">
                </iframe>
            </div>

            <div class="contact-form">
                <form action="#" method="post">

                    <div class="form-row">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-row">
                        <label for="email-address">Email:</label>
                        <input type="email" id="email-address" name="email-address"
                          placeholder="Placeholder" required>
                    </div>
                    <div class="form-row purpose-row" role="group" aria-labelledby="purpose-label">
                        <span class="row-label" id="purpose-label">Message Purpose</span>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="general" name="purpose" value="general">
                                <label for="general">General Inquiry</label>
                            </div>

                            <div class="radio-option">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                <label for="reservation">Reservation Question</label>
                            </div>

                            <div class="radio-option">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                <label for="suggestion">Website Suggestion</label>
                            </div>
                        </div>
                    </div>


                    <div class="form-row message-row">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-row checkbox-row">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <div class="submit-row">
                        <button type="submit">Get in Touch!</button>
                    </div>

                </form>
            </div>

        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.webp" alt="Photo of Jordan Reyes">
                    <figcaption>Jordan Reyes<br>Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="Photo of Casey Nolan">
                    <figcaption>Casey Nolan<br>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Photo of Priya Anand">
                    <figcaption>Priya Anand<br>Owner &amp; Founder</figcaption>
                </figure>
            </div>
        </section>
    </main>
